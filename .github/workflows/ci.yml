name: CI

# Runs on every branch: main (shared code), local (Docker) and online (Vercel).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  quality:
    name: Lint, types and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e-api:
    name: Build and API smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start the server
        run: |
          npm start -- -p 3000 > server.log 2>&1 &
          npx --yes wait-on@8 --timeout 60000 http://localhost:3000
      - name: Smoke test (cases, lawyer link, synthetic citations, facade photos)
        run: npm run smoke -- http://localhost:3000
      - name: Server log
        if: failure()
        run: cat server.log

  docker:
    name: Docker image (branch local)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      # Only the `local` branch carries the Dockerfile; elsewhere the remaining steps are skipped.
      - name: Is there a Dockerfile?
        id: image
        working-directory: .
        run: echo "present=$([ -f web/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build and start with Docker Compose
        if: steps.image.outputs.present == 'true'
        working-directory: .
        run: |
          docker compose up -d --build --wait
          docker compose ps
      - uses: actions/setup-node@v7
        if: steps.image.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Smoke test against the container
        if: steps.image.outputs.present == 'true'
        run: node scripts/smoke-test.mjs http://localhost:3000
      - name: Container log
        if: always() && steps.image.outputs.present == 'true'
        working-directory: .
        run: docker compose logs
